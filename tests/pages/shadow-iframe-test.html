<meta charset="utf-8">
<title>FrameDepth shadow iframe test</title>
<!-- A frame inside an open shadow root (a web component's embed), at
     100,150, holding iframe-video.html from localhost (another origin) with
     the 640x360 video at 20,30. Expected picture rectangle in top-page CSS
     px: 120,180 640x360. -->
<style>body { margin: 0; background: #fff; }</style>
<fd-embed></fd-embed>
<script>
  customElements.define('fd-embed', class extends HTMLElement {
    connectedCallback() {
      this.attachShadow({ mode: 'open' }).innerHTML =
        '<style>iframe { position: absolute; left: 100px; top: 150px; width: 700px; height: 420px; border: 0; padding: 0; }</style>' +
        '<iframe src="http://localhost:8731/tests/pages/iframe-video.html"></iframe>';
    }
  });
</script>
